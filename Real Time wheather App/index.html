<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"> 
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body class="bg-gray-900 text-white">
    <div id="animation-container" class="fixed inset-0 z-0 pointer-events-none w-full h-full">

    </div>

    <div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-5xl mb-4 text-blue-500"></i>
            <p class="text-xl">Loading...</p>
        </div>
    </div>

    <div id="error-handler" class="fixed inset-0 modal-bg flex items-center justify-center z-50 hidden">
        <div class="bg-red-900 border border-red-700 rounded-lg shadow-xl p-6 w-11/12 md:w-1/3 text-center">
            <h2 class="text-2xl font-bold mb-4">Error:</h2>
            <p id="error-message" class="mb-6">Data couldn't fetch.</p>
            <button id="close-btn" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-6 rounded-full transition-colors duration-300">
                Close
            </button>
        </div>
    </div>

    <div id="weather-content" class="min-h-screen w-full p-4 md:p-8 transition-opacity duration-500" >
        <div class="w-full max-w-2xl mx-auto mb-8 relative z-20">
            <form action="" id="search-city-form" class="flex item-center bg-black/30 backdrop-blur-xl rounded-full shadow-lg border border-white/20">
                <input type="text" name="search-city" id="cityInput" placeholder="Search city name..." class="w-full bg-transperent px-6 py-4 text-white placeholder-gray-600 border-none rounded-full focus:outline-none text-lg" autocomplete="off">

                <button type="button" id="current-location-btn" title="Use current location" class="text-white px-5 hover:text-gray-800 transition-colors duration-300 focus:outline-none">
                    <i class="fas fa-map-marker-alt text-xl"></i>

                </button>

                <button type="submit" class="bg-gray-700 hover:bg-gray-800 text-white m-2 px-3 py-3 rounded-full transition-colors duration-300">
                    <i class="fas fa-search text-xl"></i>

                </button>

            </form>

            <div id="suggestion-box" class="absolute top-fu;; mt-2 w-full bg-black/50 backdrop-blur-xl rounded-2xl border border-white/20 shadow-lg overflow-hidden hidden">
                
            </div>
        </div>

        <main class="w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-8 relative z-10">
            <div class="lg:col-span-2 space-y-8">
                <div class="p-6 md:p-8 rounded-3xl shadow-2xl card text-shadow flex flex-col md:flex-row items-center justify-center ">
                    <div class="text-center md:text-left">
                        <h2 id="city" class="text-3xl sm:text-4xl md:text-5xl">City Name</h2>

                        <p id="date" class="text-base sm:text-lg text-gray-300">Sunday, Nov 11</p>

                        <p id="time" class="text-lg sm:text-xl font-medium text-gray-200">00:00:00 AM</p>

                        <p id="temperature" class="text-6xl sm:text-7xl md:text-8xl  font-bold sm:mt-4 text-gray-300 mt-2">0&#176;</p>

                        <p id="weather-description" class="text-xl sm:text-2xl text-gray-300 capitalize-mt-2">Weather</p>

                    </div>

                    <img id="weather-icon" alt="Weather Icon" class="w-32 h-32 sm:w-48 sm:h-48 md:w-64 md:h-64 mt-6 md:mt-0">

                </div>

                <div>
                    <h3 class="text-2xl font-bold mb-4 text-shadow">5 Days Forcast</h3>

                    <div id="forecast-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 sm:gap-4">
                        <!-- Forecast cards will be dynamically inserted here -->

                    </div>
                </div>
            </div>

            <div class="flex flex-col">
                <div class="p-6 rounded-3xl card bckdrop-blur-xl flex flex-col space-y-5 shadow-2xl text-shadow">
                    <div class="grid grid-cols-2 gap-6 text-center">
                        <div>
                            <p class="text-gray-300 text-sm">
                                Sunrise
                            </p>
                            <p id="sunrise-time" class="font-bold text-xl sm:text-2xl">
                                --:--
                            </p>
                        </div>
                        <div>
                            <p class="text-gray-300 text-sm">
                                Sunset
                            </p>
                            <p id="sunset-time" class="font-bold text-xl sm:text-2xl">
                                --:--
                            </p>
                        </div>
                    </div>

                    <div class="border-t border-white/20 pt-5 spce-y-5 grid grid-cols-2 gap-4 lg:grid-cols-1">
                        <div class="flex justify-between items-center text-bse lg:text-lg card p-4 rounded-3xl">
                            <span>
                                <img src="https://cdn.meteocons.com/3.0.0-next.10/svg/flat/raindrop-measure.svg" class="w-12 h-12">
                                <p>Humidity</p>
                            </span>
                            <span id="humidity" class="font-bold">%</span>
                        </div>
                        <div class="flex justify-between items-center text-bse lg:text-lg card p-4 rounded-3xl">
                            <span>
                                <img src="https://cdn.meteocons.com/3.0.0-next.10/svg/fill/wind.svg" class="w-12 h-12">
                                <p>Wind</p>
                            </span>
                            <span id="wind-speed" class="font-bold">km/h</span>
                        </div>
                        <div class="flex justify-between items-center text-bse lg:text-lg card p-4 rounded-3xl">
                            <span>
                                <img src="https://cdn.meteocons.com/3.0.0-next.10/svg/flat/pressure-low.svg" class="w-12 h-12">
                                <p>Pressure</p>
                            </span>
                            <span id="pressure" class="font-bold">hPa</span>
                        </div>
                        <div class="flex justify-between items-center text-bse lg:text-lg card p-4 rounded-3xl">
                            <span>
                                <img src="https://cdn.meteocons.com/3.0.0-next.10/svg/fill/thermometer-warmer.svg" class="w-12 h-12">
                                <p>Feel Like</p>
                            </span>
                            <span id="feel-like" class="font-bold">&#176</span>
                        </div>
                        <div class="flex justify-between items-center text-bse lg:text-lg card p-4 rounded-3xl">
                            <span>
                                <img src="https://cdn.meteocons.com/3.0.0-next.10/svg/fill/smoke-particles.svg" class="w-12 h-12">
                                <p>Visibility</p>
                            </span>
                            <span id="visibility" class="font-bold">km</span>
                        </div>
                        <div class="flex justify-between items-center text-bse lg:text-lg card p-4 rounded-3xl mb-4">
                            <span>
                                <img src="https://cdn.meteocons.com/3.0.0-next.10/svg/fill/wind-dust.svg" class="w-12 h-12">
                                <p>AQI</p>
                            </span>
                            <span id="air-quality" class="font-bold">--:--</span>
                        </div>
                        
                    </div>

                    <div class="border-t border-white/20 pt-5">

                        <h3 class="text-lg font-bold mb-2">
                            Health Recommendation
                        </h3>
                        <div id="health-recomandation">
                            <p class="text-gray-300 text-sm">
                                Loading...
                            </p>
                        </div>
                    </div>

                </div>
            </div>

        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
